<section class="contact" id="contact">
  <div class="contact-inner">

    <h2 class="contact-title">Contact<br>Get in<br>With us!</h2>

    <form class="contact-form" id="contactForm">
      <div class="field">
        <label for="name"><span>*</span>Your Name</label>
        <input type="text" id="name" name="name" placeholder="Full name" required>
      </div>

      <div class="field">
        <label for="email"><span>*</span>Your Email</label>
        <input type="email" id="email" name="email" placeholder="Email Address" required>
      </div>

      <!-- <div class="field">
        <label for="details"><span>*</span>Message</label>
        <textarea id="details" name="details" rows="2"
          placeholder="What is your project goals, requirement and specific timeline..." required></textarea>
      </div> -->

      <div class="field">
        <label for="budget"><span>*</span>Message</label>
        <input type="text" id="budget" name="budget" placeholder="What is your message?" required>
      </div>

      <button type="submit" class="btn">Send message</button>
      <p class="form-status" id="formStatus"></p>
    </form>

  </div>
</section>
